[package]
name = "csboost"
version = "0.3.0"
description = "CSBoost — otimizador de Windows para Counter-Strike 2"
authors = ["Jafet Ramirez"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "csboost_lib"
# Só desktop: "cdylib"/"staticlib" (mobile) quebram o link cruzado com MinGW.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_Restore", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.56.0"
wmi = "0.18.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"
